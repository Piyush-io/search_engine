[crawl]
max_pages = 2_000_000
concurrency = 400
rate_limit_ms = 50
recrawl_days = 30

[embedding]
backend = "cuda"            # remote GPU profile
model = "bge-small-en-v1.5"
dim = 384
batch_size = 512            # favor throughput on Modal GPU rebuilds
max_length = 128
bulk_workers = 1            # single GPU worker avoids contention on one device
bulk_intra_threads = 2      # lighter CPU overhead around GPU inference

[hnsw]
backend = "hnsw"
shards = 1
m = 8
ef_construction = 80
ef_search = 96
max_elements = 5_000_000

[chunking]
context_depth = 3
window_size = 3
window_overlap = 1

[ranking]

[rocksdb]
block_cache_mb = 256

[server]
port = 3000

[paths]
db_path = "/data/crawl_data"
index_path = "/data/hnsw_index.bin"
lexical_index_path = "/data/lexical_index"
wiki_index_path = "/data/wiki_hnsw.bin"
vector_delta_path = "/data/hnsw_delta.bin"
seeds_path = "/workspace/search_engine/seeds.md"
