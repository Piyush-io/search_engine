[crawl]
max_pages = 2_000_000
concurrency = 200
rate_limit_ms = 100
recrawl_days = 30

[embedding]
backend = "cuda"            # GTX 1660 SUPER — use CUDA EP directly
model = "bge-small-en-v1.5"
dim = 384
batch_size = 64             # safer local rebuild size for 6GB VRAM
max_length = 128            # chunks are ~60 tokens; halves inference time
bulk_workers = 1            # single ORT session to reduce VRAM pressure
bulk_intra_threads = 2      # lighter CPU parallelism during local bulk embedding

[hnsw]
backend = "hnsw"
m = 8
ef_construction = 80        # lowered for local full-build RAM safety
ef_search = 120
max_elements = 5_000_000

[chunking]
context_depth = 3
window_size = 3
window_overlap = 1

[ranking]

[rocksdb]
block_cache_mb = 256

[server]
port = 3000

[paths]
db_path = "./crawl_data"
index_path = "./hnsw_index.bin"
lexical_index_path = "./lexical_index"
wiki_index_path = "./wiki_hnsw.bin"
vector_delta_path = "./hnsw_delta.bin"
seeds_path = "./seeds.md"
