[crawl]
max_pages = 60_000
concurrency = 64
rate_limit_ms = 150
recrawl_days = 30

[embedding]
backend = "cuda"
model = "bge-base-en-v1.5"
dim = 768
batch_size = 32
max_length = 384
bulk_workers = 4
bulk_intra_threads = 2
# Uncomment to offload embedding inference to a remote GPU embed_server:
remote_url = "http://192.168.1.15:3001"

[hnsw]
backend = "hnsw"
shards = 1
m = 16
ef_construction = 200
ef_search = 150
max_elements = 4_000_000

[chunking]
context_depth = 5
window_size = 3
window_overlap = 1

[ranking]
short_vec_weight = 0.15
short_lex_weight = 0.52
short_title_weight = 0.20
short_heading_weight = 0.13
short_body_weight = 0.05

long_vec_weight = 0.28
long_lex_weight = 0.32
long_title_weight = 0.16
long_heading_weight = 0.14
long_body_weight = 0.10

exact_heading_boost = 0.30
exact_body_boost = 0.15
no_heading_penalty = 0.80
weak_heading_penalty = 0.92

authority_bonus = 0.15
authority_min_lexical_score = 0.10
authority_min_structural_overlap = 0.10

host_allowlist_boost = 1.40
host_soft_penalty = 0.70
host_hard_cap = 5
host_allowlist = [
    "www.postgresql.org",
    "postgresql.org",
    "wiki.postgresql.org",
    "sqlite.org",
    "www.sqlite.org",
    "developer.mozilla.org",
    "docs.python.org",
    "doc.rust-lang.org",
    "en.cppreference.com",
]
host_penalty_list = [
    "stackoverflow.com",
    "reddit.com",
    "medium.com",
    "dev.to",
    "github.com",
]

rrf_k = 30.0
short_rrf_vec_weight = 0.35
short_rrf_lex_weight = 2.60
long_rrf_vec_weight = 0.90
long_rrf_lex_weight = 1.20

score_floor_fraction = 0.08
score_floor_min = 0.06
host_cap_divisor = 2
host_cap_min = 3
host_cap_max = 6

lexical_only_fallback_enabled = true
lexical_only_pool_mult = 20
lexical_only_pool_cap = 1000
lexical_relaxed_fallback_enabled = true
lexical_relaxed_min_hits = 4
lexical_relaxed_extra_k = 200

rerank_enabled = true
rerank_pool_size = 40
rerank_blend_weight = 0.28

# Identifier queries skip reranker and heading penalties
# (wired in src/search/query.rs)

[rocksdb]
block_cache_mb = 256

[server]
port = 3000

[paths]
db_path = "./crawl_data.niche"
index_path = "./hnsw_index.niche.bin"
lexical_index_path = "./lexical_index.niche"
wiki_index_path = "./wiki_hnsw.niche.bin"
vector_delta_path = "./hnsw_delta.niche.bin"
seeds_path = "./seeds.niche.md"
